<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1f">
<title>Tank Arena (LAN)</title>
<style>
  :root { color-scheme: dark; --ui: #2b2b33; --ui2: #44444f; --fg: #f2f2f5; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none;
    background: #1b1b1f; color: var(--fg); font: 14px/1.3 system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100dvh; display: block; touch-action: none; }
  .hud { position: fixed; pointer-events: none; }
  #lb { top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); width: 170px; background: #0006; border-radius: 6px; padding: 6px 8px; font-size: 12px; }
  #lb h4 { margin: 0 0 3px; font-size: 12px; text-align: center; }
  #lb div { display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; overflow: hidden; }
  #lb .me { color: #7fd8ff; font-weight: 600; }
  #xp { left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(340px, 56vw); }
  #xp .bar { height: 16px; border-radius: 8px; background: #0007; overflow: hidden; border: 2px solid #0009; }
  #xp .fill { height: 100%; width: 0; background: #f5d94e; }
  #xp .txt { text-align: center; font-size: 12px; margin-top: 2px; text-shadow: 0 1px 2px #000; }
  #classes { top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); display: flex; flex-wrap: wrap; gap: 6px; max-width: 60vw; }
  #classes button { pointer-events: auto; }
  button { font: inherit; color: var(--fg); background: var(--ui2); border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .5; cursor: default; }
  #stats { left: max(8px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom)); width: 210px; display: none; background: #0006; border-radius: 8px; padding: 6px; }
  #stats.show { display: block; }
  #stats .hdr { font-size: 12px; margin: 0 0 4px 2px; }
  .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; font-size: 12px; pointer-events: auto; }
  .row .lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pips { display: flex; gap: 1px; }
  .pip { width: 7px; height: 12px; background: #0008; }
  .row button { padding: 2px 9px; min-width: 30px; min-height: 26px; font-weight: 700; }
  @media (max-height: 520px) { #stats { width: 190px; bottom: 36px; } .row { margin: 1px 0; } #lb { width: 140px; } }
  #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000a; padding: 12px; }
  #menu.hide { display: none; }
  .card { background: var(--ui); border-radius: 12px; padding: 18px; width: min(420px, 94vw); max-height: 96dvh; overflow: auto; text-align: center; touch-action: pan-y; }
  .card h1 { margin: 0 0 6px; font-size: 24px; }
  .card input { width: 100%; font: inherit; font-size: 16px; padding: 10px; border-radius: 6px; border: 2px solid var(--ui2); background: #1b1b1f; color: var(--fg); margin: 8px 0; user-select: text; -webkit-user-select: text; }
  .card button { width: 100%; font-size: 16px; background: #2a8fd6; }
  .small { font-size: 12px; opacity: .8; margin: 8px 0 0; }
  #status { min-height: 1.3em; }
  #msg { color: #ffb86b; min-height: 1.3em; }
  #lan code { background: #0006; padding: 1px 5px; border-radius: 4px; user-select: text; -webkit-user-select: text; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lb" class="hud"><h4>Leaderboard</h4><span id="lbrows"></span></div>
<div id="classes" class="hud"></div>
<div id="stats" class="hud"><div class="hdr">Upgrades <b id="pts"></b></div><div id="rows"></div></div>
<div id="xp" class="hud"><div class="bar"><div class="fill" id="xpfill"></div></div><div class="txt" id="xptxt"></div></div>
<div id="menu">
  <div class="card">
    <h1>Tank Arena</h1>
    <div id="msg"></div>
    <input id="name" maxlength="16" placeholder="Nickname" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="play" disabled>Play</button>
    <p id="status" class="small">Connecting…</p>
    <p class="small"><b>PC:</b> WASD/arrows move, mouse aims, click/Space fires, keys 1-8 upgrade.<br>
    <b>Phone:</b> left thumb moves, right thumb aims and fires (landscape recommended).</p>
    <p id="lan" class="small"></p>
  </div>
</div>
<script src="/client.js"></script>
</body>
</html>
