name: Android APK
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install game dependencies
        run: npm ci
      - name: Install Android dependencies
        run: npm install --prefix mobile --no-audit --no-fund
      - name: Type-check shared game
        run: npm run typecheck
      - name: Build APK
        run: npm run android:apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Tank-Arena-Android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
